<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- connect-src 'none' blocks fetch/XHR/WebSocket/beacons: the page cannot send data anywhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: https://cdnjs.cloudflare.com; style-src 'self' file: 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Spend Analyzer</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg>
      Spend Analyzer
    </div>
    <nav class="nav" aria-label="Sections">
      <a href="#/dashboard" data-route="dashboard">Dashboard</a>
      <a href="#/transactions" data-route="transactions">Transactions</a>
      <a href="#/import" data-route="import">Import</a>
      <a href="#/rules" data-route="rules">Rules</a>
      <a href="#/settings" data-route="settings">Settings</a>
    </nav>
    <div class="local-badge" title="All data stays in this browser (IndexedDB). The page is blocked from making network requests.">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span>Local only</span>
    </div>
  </div>
</header>
<main id="view" tabindex="-1"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.6.1/papaparse.min.js" integrity="sha384-ZVJUwa/1rxfBIZ6gJqlM9PvedRQuTamdrl5OnnNm29zrIS8+VHFCifyWfJrKcveV" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>

<script src="js/views/rules.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
